<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Translation Critic's Case File</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&family=Playfair+Display:wght@600;700;900&display=swap');

:root{
  --ink:#12141c;
  --ink2:#1b1f2b;
  --paper:#efe6cf;
  --paper-dark:#e2d6b3;
  --brass:#c9a24b;
  --brass-dim:#8f7433;
  --red:#8b2f2f;
  --red-bright:#b0392f;
  --green:#3a5a40;
  --text-dark:#241f14;
  --muted:#6b5f45;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse at 20% 0%, #232a3d 0%, transparent 55%),
    radial-gradient(ellipse at 80% 100%, #1a1f30 0%, transparent 55%),
    var(--ink);
  font-family:'Courier Prime', monospace;
  color:var(--paper);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 16px;
}
.stage{
  width:100%;
  max-width:780px;
}

/* ---------- header ---------- */
.masthead{
  text-align:center;
  margin-bottom:22px;
}
.masthead .kicker{
  font-family:'Special Elite', monospace;
  letter-spacing:5px;
  font-size:11px;
  color:var(--brass);
  text-transform:uppercase;
}
.masthead h1{
  font-family:'Playfair Display', serif;
  font-weight:900;
  font-size:clamp(24px,4.5vw,36px);
  margin:6px 0 4px;
  color:var(--paper);
}
.masthead .sub{
  font-size:13px;
  color:#a6adc4;
  font-style:italic;
}

/* ---------- progress ---------- */
.progress-row{
  display:flex;
  justify-content:center;
  gap:6px;
  margin:18px 0 6px;
  flex-wrap:wrap;
}
.dot{
  width:9px;height:9px;border-radius:50%;
  background:#3a4056;
  border:1px solid #4c5470;
  transition:background .25s;
}
.dot.done{background:var(--brass);border-color:var(--brass);}
.dot.current{background:var(--paper);border-color:var(--paper);box-shadow:0 0 0 3px rgba(201,162,75,.3);}

.score-line{
  text-align:center;
  font-size:12px;
  color:#8f97b3;
  margin-bottom:18px;
  letter-spacing:1px;
}
.score-line b{color:var(--brass);}
.score-line b.timer-warn{color:#e08585;}

/* ---------- case file card ---------- */
.case-card{
  position:relative;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.02) 0 2px, transparent 2px 4px),
    var(--paper);
  color:var(--text-dark);
  border-radius:3px;
  padding:30px 30px 26px;
  box-shadow:0 22px 45px rgba(0,0,0,.45), 0 2px 0 rgba(0,0,0,.15) inset;
  transform:rotate(-0.4deg);
}
.case-card:before{
  content:"";
  position:absolute;
  top:-14px; left:26px;
  width:70px; height:26px;
  background:rgba(201,162,75,.55);
  border:1px solid rgba(201,162,75,.75);
  transform:rotate(-3deg);
}
.case-no{
  font-family:'Special Elite', monospace;
  font-size:12px;
  letter-spacing:2px;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:14px;
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:6px;
}
.difficulty{
  padding:2px 8px;
  border-radius:2px;
  font-size:10px;
  letter-spacing:1.5px;
}
.difficulty.easy{background:#dfeadb;color:#2c5230;}
.difficulty.medium{background:#f3e6c4;color:#7a5a12;}
.difficulty.hard{background:#f1d9d6;color:#8b2f2f;}

.pair{
  display:flex;
  flex-direction:column;
  gap:14px;
  margin-bottom:18px;
}
.line{
  border-left:3px solid var(--brass-dim);
  padding:10px 14px;
  background:rgba(0,0,0,.035);
}
.line .lbl{
  font-family:'Special Elite', monospace;
  font-size:10.5px;
  letter-spacing:2px;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:4px;
}
.line .txt{
  font-size:16px;
  line-height:1.5;
}
.line.translated{border-left-color:var(--red);}

.question{
  font-family:'Special Elite', monospace;
  font-size:13px;
  color:var(--text-dark);
  margin:6px 0 14px;
  text-align:center;
  letter-spacing:.5px;
}

.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
@media(max-width:560px){ .options{grid-template-columns:1fr;} }

.opt{
  font-family:'Courier Prime', monospace;
  font-size:13px;
  text-align:left;
  padding:12px 14px;
  background:#fbf7ea;
  border:1.5px solid #cbb98a;
  border-radius:2px;
  cursor:pointer;
  color:var(--text-dark);
  transition:transform .12s, box-shadow .12s, background .12s;
  line-height:1.35;
}
.opt b{display:block;font-size:12.5px;letter-spacing:.5px;margin-bottom:2px;}
.opt:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:0 6px 14px rgba(0,0,0,.18);
  background:#fff;
}
.opt:disabled{cursor:default;}
.opt.correct-pick{background:#dfeadb;border-color:var(--green);}
.opt.wrong-pick{background:#f1d9d6;border-color:var(--red);}
.opt.reveal-correct{background:#dfeadb;border-color:var(--green);box-shadow:0 0 0 2px var(--green) inset;}

/* stamp */
.stamp{
  position:absolute;
  top:38%;
  left:50%;
  transform:translate(-50%,-50%) rotate(-14deg) scale(0.4);
  font-family:'Special Elite', monospace;
  font-size:clamp(24px,5vw,38px);
  font-weight:700;
  letter-spacing:4px;
  padding:10px 22px;
  border:5px solid;
  border-radius:8px;
  opacity:0;
  pointer-events:none;
  z-index:5;
  text-transform:uppercase;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1), opacity .35s;
}
.stamp.show{opacity:.9; transform:translate(-50%,-50%) rotate(-14deg) scale(1);}
.stamp.ok{color:var(--green); border-color:var(--green);}
.stamp.no{color:var(--red-bright); border-color:var(--red-bright);}

.explain{
  margin-top:16px;
  padding:14px 16px;
  background:rgba(0,0,0,.05);
  border-radius:2px;
  font-size:13px;
  line-height:1.55;
  display:none;
}
.explain.show{display:block;}
.explain .tag{
  display:inline-block;
  font-family:'Special Elite', monospace;
  font-size:10.5px;
  letter-spacing:1.5px;
  color:var(--paper);
  background:var(--ink2);
  padding:3px 8px;
  border-radius:2px;
  margin-bottom:8px;
}

.next-row{
  margin-top:18px;
  text-align:right;
}
.next-btn{
  font-family:'Special Elite', monospace;
  letter-spacing:1.5px;
  font-size:13px;
  background:var(--ink2);
  color:var(--brass);
  border:1px solid var(--brass-dim);
  padding:10px 20px;
  border-radius:2px;
  cursor:pointer;
  display:none;
}
.next-row.show .next-btn{display:inline-block;}
.next-btn:hover{background:#252b3d;}

/* ---------- intro / end screens ---------- */
.panel{
  background:var(--paper);
  color:var(--text-dark);
  border-radius:3px;
  padding:34px 30px;
  box-shadow:0 22px 45px rgba(0,0,0,.45);
  text-align:center;
}
.panel h2{
  font-family:'Playfair Display', serif;
  font-size:24px;
  margin:0 0 10px;
}
.panel p{
  font-size:14px;
  line-height:1.6;
  color:var(--muted);
  margin:0 auto 18px;
  max-width:540px;
}
.framework{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin:20px 0 24px;
}
@media(max-width:560px){.framework{grid-template-columns:1fr 1fr;}}
.framework div{
  background:#fbf7ea;
  border:1px solid #cbb98a;
  border-radius:2px;
  padding:10px 6px;
  font-size:11px;
  line-height:1.4;
}
.framework div b{display:block;font-size:12.5px;margin-bottom:2px;}
.start-btn{
  font-family:'Special Elite', monospace;
  letter-spacing:2px;
  font-size:14px;
  background:var(--ink2);
  color:var(--brass);
  border:1px solid var(--brass-dim);
  padding:13px 30px;
  border-radius:2px;
  cursor:pointer;
}
.start-btn:hover{background:#252b3d;}

.rank-badge{
  font-family:'Special Elite', monospace;
  font-size:11px;
  letter-spacing:3px;
  color:var(--brass);
  text-transform:uppercase;
  margin-bottom:6px;
}
.name-form{
  max-width:340px;
  margin:0 auto 20px;
  text-align:left;
}
.name-form label{
  display:block;
  font-family:'Special Elite', monospace;
  font-size:11px;
  letter-spacing:1.5px;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:6px;
}
.name-form input{
  width:100%;
  font-family:'Courier Prime', monospace;
  font-size:15px;
  padding:11px 12px;
  border:1.5px solid #cbb98a;
  border-radius:2px;
  background:#fbf7ea;
  color:var(--text-dark);
  margin-bottom:6px;
}
.name-form input:focus{outline:2px solid var(--brass);}
.name-err{
  font-size:11.5px;
  color:var(--red-bright);
  min-height:16px;
  margin-bottom:4px;
}
.player-tag{
  display:inline-block;
  font-family:'Special Elite', monospace;
  font-size:11px;
  letter-spacing:1.5px;
  color:var(--ink);
  background:var(--brass);
  padding:4px 10px;
  border-radius:2px;
  margin-bottom:14px;
}
.submit-row{
  margin-top:22px;
  padding-top:18px;
  border-top:1px dashed #cbb98a;
}
.submit-row p{font-size:12px;color:var(--muted);margin:0 0 12px;}
.submit-btn{
  font-family:'Special Elite', monospace;
  letter-spacing:1.5px;
  font-size:13px;
  background:var(--green);
  color:#fdf9ec;
  border:1px solid #2d4633;
  padding:12px 24px;
  border-radius:2px;
  cursor:pointer;
}
.submit-btn:hover{background:#325038;}
.submit-btn:disabled{background:#8fa590;cursor:default;}
.submit-note{
  font-size:11px;
  color:var(--muted);
  margin-top:10px;
}
.big-score{
  font-family:'Playfair Display', serif;
  font-weight:900;
  font-size:50px;
  color:var(--text-dark);
  margin:2px 0 4px;
}
.recap{
  text-align:left;
  margin:22px auto 0;
  max-width:540px;
  font-size:12px;
  max-height:280px;
  overflow-y:auto;
}
.recap-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:6px 0;
  border-bottom:1px dashed #cbb98a;
}
.recap-row span:last-child{font-weight:700; white-space:nowrap;}

.admin-table{
  width:100%;
  border-collapse:collapse;
  font-size:12.5px;
  text-align:left;
  margin-top:12px;
}
.admin-table th{
  font-family:'Special Elite', monospace;
  font-size:10.5px;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--muted);
  border-bottom:2px solid #cbb98a;
  padding:8px 10px;
}
.admin-table td{
  padding:8px 10px;
  border-bottom:1px dashed #d8cba0;
}
.admin-table tr:nth-child(even){background:rgba(0,0,0,.03);}
.admin-toolbar{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:18px;
}
.admin-empty{
  text-align:center;
  color:var(--muted);
  padding:24px;
}
</style>
</head>
<body>
<div class="stage">

  <div class="masthead">
    <div class="kicker">Lesson 6 · Practice Activity</div>
    <h1>The Translation Critic's Case File</h1>
    <div class="sub">You are the translation critic. File each translation under the right category.</div>
  </div>

  <div id="progressArea" style="display:none">
    <div class="progress-row" id="dots"></div>
    <div class="score-line">
      Score: <b id="scoreNow">0</b> / <span id="scoreMax">0</span>
      &nbsp;·&nbsp; ⏱ Time left: <b id="timerEl">05:00</b>
    </div>
  </div>

  <div id="root"></div>

</div>

<script>
// ==== FIREBASE CONFIG (Realtime Database URL) ====
const FIREBASE_DB_URL = "https://translation-game-4507c-default-rtdb.asia-southeast1.firebasedatabase.app";
const IS_ADMIN = new URLSearchParams(window.location.search).get("admin") === "1";

let idx = 0;
let score = 0;
let answered = false;
let playerName = "";

const TIME_LIMIT_SECONDS = 300; // 5 minutes
let timeLeft = TIME_LIMIT_SECONDS;
let timerId = null;

const CASES = [
  {
    label: "Case #01", difficulty: "easy",
    source: "The town hall was built in 1890.",
    translated: "Tòa thị chính được xây dựng vào năm 1980.",
    correct: "reference",
    explain: "The date is changed from 1890 to 1980 — a real-world fact is misrepresented. This is a <b>referential error</b>: it conflicts with reality, unrelated to grammar or vocabulary."
  },
  {
    label: "Case #02", difficulty: "easy",
    source: "The committee reached a unanimous decision.",
    translated: "Ủy ban đã đạt được một quyết định nhất trí.",
    correct: "accurate",
    explain: "The translation is factually correct, grammatical, natural, and clear. No referential error, no linguistic error, no awkwardness — this is an <b>accurate</b> translation."
  },
  {
    label: "Case #03", difficulty: "easy",
    source: "It's raining cats and dogs.",
    translated: "Trời đang mưa mèo và chó.",
    correct: "craft",
    explain: "A word-for-word rendering that becomes meaningless in Vietnamese. This is a textbook case of <b>translationese</b> — the product of mechanical, non-contextual translation."
  },
  {
    label: "Case #04", difficulty: "easy",
    source: "I bought three books yesterday.",
    translated: "Tôi đã mua ba con sách hôm qua.",
    correct: "linguistic",
    explain: "\"Con\" is a classifier used for animals, not for \"sách\" (books) — it should be \"cuốn/quyển\". This is a <b>linguistic error</b>: incorrect target-language grammar, unrelated to real-world facts."
  },
  {
    label: "Case #05", difficulty: "easy",
    source: "The patient's temperature was 39°C.",
    translated: "Nhiệt độ của bệnh nhân là 39°F.",
    correct: "reference",
    explain: "39°C and 39°F represent very different values medically. Swapping the unit without converting the number is a <b>referential error</b> — a factual mistake with potentially serious consequences in a medical text."
  },
  {
    label: "Case #06", difficulty: "medium",
    source: "Please find attached the invoice.",
    translated: "Vui lòng tìm đính kèm hóa đơn.",
    correct: "craft",
    explain: "The translation mirrors the English word order and phrase (\"find attached\" → \"tìm đính kèm\"), producing a stiff, unnatural Vietnamese sentence. This is <b>translationese</b> — falling under the \"craft\" area, not a clear grammar violation but noticeably foreign-sounding."
  },
  {
    label: "Case #07", difficulty: "medium",
    source: "He gave her a book.",
    translated: "Anh ấy đưa cho cô ấy những một cuốn sách.",
    correct: "linguistic",
    explain: "\"Những\" (plural marker) and \"một\" (\"one\") contradict each other — this combination doesn't exist in correct Vietnamese grammar. This is a <b>linguistic error</b> caused by insufficient command of the target language."
  },
  {
    label: "Case #08", difficulty: "medium",
    source: "He was as busy as a bee.",
    translated: "Anh ấy bận rộn như con thoi đưa.",
    correct: "art",
    explain: "Instead of a stiff literal rendering of \"busy as a bee\", the translator chose a natural, familiar Vietnamese image to convey the same meaning. This is <b>art</b> — creative, context-driven re-creation, a positive quality worth crediting."
  },
  {
    label: "Case #09", difficulty: "medium",
    source: "The bridge spans 1,200 metres.",
    translated: "Cây cầu dài 1.020 mét.",
    correct: "reference",
    explain: "The digits are transposed (1,200 → 1,020) — easy to miss on a quick read, but it is still a factual/numerical <b>referential error</b>, changing real-world data."
  },
  {
    label: "Case #10", difficulty: "medium",
    source: "By next year, she will have graduated.",
    translated: "Đến năm sau, cô ấy đã tốt nghiệp.",
    correct: "linguistic",
    explain: "\"Đã\" marks a completed past action, but the source describes a future event completed by a future point (future perfect) — it should be something like \"sẽ tốt nghiệp\" / \"sẽ hoàn tất việc tốt nghiệp\". Using \"đã\" misplaces the event in time — an aspect-marker <b>linguistic error</b>."
  },
  {
    label: "Case #11", difficulty: "hard",
    source: "We look forward to hearing from you.",
    translated: "Chúng tôi mong đợi được nghe từ bạn.",
    correct: "craft",
    explain: "\"Nghe từ bạn\" is a literal calque of \"hear from you\". It's grammatically fine, but a natural Vietnamese business register would say something like \"mong sớm nhận được phản hồi từ bạn\". This is subtle <b>translationese</b> — unnatural phrasing rather than an outright grammar mistake."
  },
  {
    label: "Case #12", difficulty: "hard",
    source: "The board hereby authorises the release of funds.",
    translated: "Hội đồng quản trị theo đây cho phép giải ngân số tiền nói trên.",
    correct: "accurate",
    explain: "This formal, legal-sounding register is appropriate for a formal source text — it's not translationese, just correctly matched formality. This case tests whether you mistake appropriate formal style for an error; it should be judged <b>accurate</b>."
  },
  {
    label: "Case #13", difficulty: "hard",
    source: "A journey of a thousand miles begins with a single step.",
    translated: "Vạn dặm đường xa, khởi đầu từ một bước chân.",
    correct: "art",
    explain: "Rather than a flat literal rendering, the translator used a rhythmic, parallel four-syllable structure typical of Vietnamese proverbs, recreating the aphoristic tone of the original. A subtle but genuine act of <b>art</b> — creative, culturally attuned re-creation."
  },
  {
    label: "Case #14", difficulty: "hard",
    source: "The results may indicate a link between the two variables.",
    translated: "Kết quả cho thấy có mối liên hệ giữa hai biến số.",
    correct: "reference",
    explain: "The source hedges with \"may indicate\" (a possibility, appropriate to cautious scientific writing), but the translation drops the hedge and asserts it as established fact (\"cho thấy có\" = \"shows that there is\"). This subtly changes the certainty of the claim — a <b>referential</b> distortion of meaning, not just a stylistic issue."
  },
  {
    label: "Case #15", difficulty: "hard",
    source: "She is responsible for the project.",
    translated: "Cô ấy chịu trách nhiệm về cho dự án.",
    correct: "linguistic",
    explain: "\"Chịu trách nhiệm về\" alone already correctly means \"responsible for\" — adding \"cho\" creates a redundant, ungrammatical double-preposition collocation. Subtle enough that a fast reader might skim right past it — a <b>linguistic error</b>."
  },
  {
    label: "Case #16", difficulty: "hard",
    source: "Please let me know if you have any questions.",
    translated: "Nếu có thắc mắc gì, xin vui lòng cho tôi biết.",
    correct: "accurate",
    explain: "Correctly and naturally translated, with no notable creative flourish — nor does it need one. This case tests whether you over-value flashy creativity: a solid, competent, plain translation should be judged <b>accurate</b>, not mistaken for \"art\"."
  },
];

const OPTIONS = [
  {key:"reference", title:"Referential Error", sub:"Wrong facts / data"},
  {key:"linguistic", title:"Linguistic Error", sub:"Wrong grammar / vocabulary"},
  {key:"craft", title:"Translationese", sub:"Stiff, unnatural, calque-like"},
  {key:"art", title:"Good Re-creation", sub:"Creative, context-driven solution"},
  {key:"accurate", title:"Accurate", sub:"No issue, meets the standard"},
];

const root = document.getElementById("root");
const dotsEl = document.getElementById("dots");
const progressArea = document.getElementById("progressArea");
const scoreNowEl = document.getElementById("scoreNow");
const scoreMaxEl = document.getElementById("scoreMax");
scoreMaxEl.textContent = CASES.length;

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

function renderIntro(){
  if(IS_ADMIN){
    renderAdminBoard();
    return;
  }
  root.innerHTML = `
    <div class="panel">
      <h2>Before you clock in...</h2>
      <p>Please register your identity so the case file is credited to the right investigator.</p>
      <div class="name-form">
        <label>Full name</label>
        <input id="nameInput" type="text" placeholder="Jane Smith" maxlength="40" autocomplete="off">
        <div class="name-err" id="nameErr"></div>
      </div>
      <button class="start-btn" onclick="confirmName()">Confirm identity →</button>
    </div>
  `;
  const inp = document.getElementById("nameInput");
  inp.focus();
  inp.addEventListener("keydown", (e)=>{ if(e.key === "Enter") confirmName(); });
}

function confirmName(){
  const val = document.getElementById("nameInput").value.trim();
  if(!val){
    document.getElementById("nameErr").textContent = "Please enter your name before starting.";
    return;
  }
  playerName = val;
  renderFramework();
}

function renderFramework(){
  root.innerHTML = `
    <div class="panel">
      <span class="player-tag">Investigator: ${escapeHtml(playerName)}</span>
      <h2>Field Manual</h2>
      <p>Peter Newmark splits translation assessment into four areas: <b>science</b> (clearly right/wrong), <b>craft</b> (natural vs. stiff), <b>art</b> (creative, well re-created) and <b>taste</b>. You'll review ${CASES.length} "case files" — each one pairs a source sentence with a translation. Your job: stamp each case with the correct category. Questions run from easy to hard.</p>
      <p style="font-weight:700; color:var(--red-bright);">⏱ You have ${Math.floor(TIME_LIMIT_SECONDS/60)} minutes to complete all ${CASES.length} cases. When time is up, your current score is submitted automatically.</p>
      <div class="framework">
        <div><b>Science</b>Referential &amp; linguistic errors — clearly right or wrong</div>
        <div><b>Craft</b>Translationese — stiff, calque-like phrasing</div>
        <div><b>Art</b>Creative, context-driven re-creation</div>
        <div><b>Accurate</b>No error, meets the standard</div>
      </div>
      <button class="start-btn" onclick="startGame()">▶ Open Case #01</button>
      ${FIREBASE_DB_URL ? `<button class="start-btn" style="margin-left:10px;" onclick="renderLeaderboard()">📋 View leaderboard</button>` : ``}
    </div>
  `;
}

function startGame(){
  idx = 0; score = 0; answered = false;
  timeLeft = TIME_LIMIT_SECONDS;
  progressArea.style.display = "block";
  renderDots();
  startTimer();
  renderCase();
}

function startTimer(){
  clearInterval(timerId);
  updateTimerDisplay();
  timerId = setInterval(()=>{
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft <= 0){
      clearInterval(timerId);
      timeUp();
    }
  }, 1000);
}

function updateTimerDisplay(){
  const el = document.getElementById("timerEl");
  if(!el) return;
  const m = Math.max(0, Math.floor(timeLeft / 60));
  const s = Math.max(0, timeLeft % 60);
  el.textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  el.classList.toggle("timer-warn", timeLeft <= 60);
}

function timeUp(){
  answered = true;
  renderEnd(true);
}

function renderDots(){
  dotsEl.innerHTML = CASES.map((_,i)=>{
    let cls = "dot";
    if(i < idx) cls += " done";
    else if(i === idx) cls += " current";
    return `<div class="${cls}"></div>`;
  }).join("");
  scoreNowEl.textContent = score;
}

function renderCase(){
  answered = false;
  const c = CASES[idx];
  root.innerHTML = `
    <div class="case-card">
      <div class="stamp" id="stampEl"></div>
      <div class="case-no">
        <span>${c.label} — English source / Vietnamese translation</span>
        <span class="difficulty ${c.difficulty}">${c.difficulty.toUpperCase()}</span>
      </div>
      <div class="pair">
        <div class="line">
          <div class="lbl">Source text (EN)</div>
          <div class="txt">${c.source}</div>
        </div>
        <div class="line translated">
          <div class="lbl">Translation (VI)</div>
          <div class="txt">${c.translated}</div>
        </div>
      </div>
      <div class="question">Which case file does this translation belong to?</div>
      <div class="options" id="optsEl">
        ${OPTIONS.map(o=>`
          <button class="opt" data-key="${o.key}" onclick="pick('${o.key}')">
            <b>${o.title}</b>${o.sub}
          </button>
        `).join("")}
      </div>
      <div class="explain" id="explainEl"></div>
      <div class="next-row" id="nextRow">
        <button class="next-btn" onclick="nextCase()">Next case →</button>
      </div>
    </div>
  `;
  renderDots();
}

function pick(key){
  if(answered) return;
  answered = true;
  const c = CASES[idx];
  const isCorrect = key === c.correct;
  if(isCorrect) score++;

  document.querySelectorAll(".opt").forEach(btn=>{
    btn.disabled = true;
    const k = btn.getAttribute("data-key");
    if(k === c.correct) btn.classList.add("reveal-correct");
    if(k === key && !isCorrect) btn.classList.add("wrong-pick");
    if(k === key && isCorrect) btn.classList.add("correct-pick");
  });

  const stamp = document.getElementById("stampEl");
  stamp.textContent = isCorrect ? "Correct" : "Wrong file";
  stamp.classList.add(isCorrect ? "ok" : "no");
  requestAnimationFrame(()=> stamp.classList.add("show"));

  const explainEl = document.getElementById("explainEl");
  const tagOpt = OPTIONS.find(o=>o.key === c.correct);
  explainEl.innerHTML = `<span class="tag">${tagOpt.title}</span><br>${c.explain}`;
  explainEl.classList.add("show");

  document.getElementById("nextRow").classList.add("show");
  scoreNowEl.textContent = score;
}

function nextCase(){
  idx++;
  if(idx >= CASES.length){
    clearInterval(timerId);
    renderEnd(false);
  } else {
    renderCase();
  }
}

function renderEnd(isTimeout){
  progressArea.style.display = "none";
  clearInterval(timerId);
  const pct = score / CASES.length;
  let rank, note;
  if(pct === 1){
    rank = "Newmark Specialist";
    note = "You confidently tell apart all four areas — science, craft, art, and taste — in translation assessment.";
  } else if(pct >= 0.75){
    rank = "Dedicated Critic";
    note = "Very good! You have a solid grasp of Newmark's analytical framework, with just a few points to sharpen.";
  } else if(pct >= 0.5){
    rank = "Promising Investigator";
    note = "You've got the core idea, but review the boundaries between referential errors, linguistic errors, and translationese.";
  } else {
    rank = "Trainee Investigator";
    note = "Revisit the four-area framework (science – craft – art – taste) in Chapter 17, then give it another try.";
  }

  const hasBoard = !!FIREBASE_DB_URL;

  root.innerHTML = `
    <div class="panel">
      <span class="player-tag">${escapeHtml(playerName)}</span>
      <div class="rank-badge">Investigation result</div>
      <div class="big-score">${score} / ${CASES.length}</div>
      <h2>${rank}</h2>
      ${isTimeout ? `<p style="color:#b0392f; font-weight:700;">⏰ Time's up (5 minutes) — your current score was submitted automatically.</p>` : ``}
      <p>${note}</p>
      <div class="recap">
        ${CASES.map(c=>{
          const label = OPTIONS.find(o=>o.key===c.correct).title;
          return `<div class="recap-row"><span>${c.label}</span><span>${label}</span></div>`;
        }).join("")}
      </div>
      ${hasBoard ? `
      <div class="submit-row">
        <p>Submit your score to the class leaderboard to compete for the top spot.</p>
        <button class="submit-btn" id="submitBtn" onclick="submitScore()">🏆 Submit to leaderboard</button>
        <div class="submit-note" id="submitNote"></div>
      </div>` : ``}
      <div style="margin-top:24px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button class="start-btn" onclick="startGame()">↺ Start over</button>
        ${hasBoard ? `<button class="start-btn" onclick="renderLeaderboard()">📋 View leaderboard</button>` : ``}
      </div>
    </div>
  `;
}

async function submitScore(){
  const btn = document.getElementById("submitBtn");
  const note = document.getElementById("submitNote");
  btn.disabled = true;
  btn.textContent = "Submitting...";
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/scores.json`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ name: playerName, score: score, total: CASES.length, time: Date.now() })
    });
    if(!res.ok) throw new Error("network");
    btn.textContent = "✓ Submitted";
    note.textContent = "Tap \"View leaderboard\" to check your ranking.";
  } catch(err){
    btn.disabled = false;
    btn.textContent = "🏆 Submit to leaderboard";
    note.textContent = "Submission failed — check your connection and try again.";
  }
}

async function renderLeaderboard(){
  root.innerHTML = `
    <div class="panel">
      <div class="rank-badge">Leaderboard</div>
      <h2>Top investigators</h2>
      <div id="boardArea" style="text-align:left; max-width:480px; margin:18px auto;">
        <p style="text-align:center;">Loading...</p>
      </div>
      <button class="start-btn" onclick="renderLeaderboard()">↻ Refresh</button>
      <button class="start-btn" onclick="startGame()">↺ Play again</button>
    </div>
  `;
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/scores.json`);
    const data = await res.json();
    const entries = data ? Object.values(data) : [];
    entries.sort((a,b)=> b.score - a.score || a.time - b.time);
    const boardArea = document.getElementById("boardArea");
    if(entries.length === 0){
      boardArea.innerHTML = `<p style="text-align:center;">No submissions yet.</p>`;
      return;
    }
    boardArea.innerHTML = entries.slice(0,15).map((e,i)=>{
      const medal = i===0 ? "🥇" : i===1 ? "🥈" : i===2 ? "🥉" : `${i+1}.`;
      return `<div class="recap-row"><span>${medal} ${escapeHtml(e.name)}</span><span>${e.score}/${e.total}</span></div>`;
    }).join("");
  } catch(err){
    document.getElementById("boardArea").innerHTML = `<p style="text-align:center;">Couldn't load the leaderboard — check your connection.</p>`;
  }
}

async function renderAdminBoard(){
  root.innerHTML = `
    <div class="panel">
      <div class="rank-badge">Admin mode</div>
      <h2>Full submission list</h2>
      <div id="adminArea"><p style="text-align:center;">Loading data...</p></div>
      <div class="admin-toolbar">
        <button class="start-btn" onclick="renderAdminBoard()">↻ Refresh</button>
        <button class="start-btn" id="exportBtn" onclick="exportCsv()" style="display:none;">⬇ Export CSV</button>
      </div>
    </div>
  `;
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/scores.json`);
    const data = await res.json();
    const entries = data ? Object.values(data) : [];
    entries.sort((a,b)=> b.score - a.score || a.time - b.time);
    window._adminEntries = entries;
    const area = document.getElementById("adminArea");
    if(entries.length === 0){
      area.innerHTML = `<div class="admin-empty">No submissions yet.</div>`;
      return;
    }
    document.getElementById("exportBtn").style.display = "inline-block";
    area.innerHTML = `
      <table class="admin-table">
        <thead><tr><th>#</th><th>Name</th><th>Score</th><th>Submitted at</th></tr></thead>
        <tbody>
          ${entries.map((e,i)=>{
            const d = new Date(e.time);
            const timeStr = d.toLocaleString("en-GB");
            return `<tr><td>${i+1}</td><td>${escapeHtml(e.name)}</td><td>${e.score}/${e.total}</td><td>${timeStr}</td></tr>`;
          }).join("")}
        </tbody>
      </table>
    `;
  } catch(err){
    document.getElementById("adminArea").innerHTML = `<div class="admin-empty">Couldn't load data — check your connection.</div>`;
  }
}

function exportCsv(){
  const entries = window._adminEntries || [];
  if(entries.length === 0) return;
  let csv = "\uFEFF" + "No.,Name,Score,Total,Submitted at\n";
  entries.forEach((e,i)=>{
    const d = new Date(e.time);
    const timeStr = d.toLocaleString("en-GB");
    const safeName = String(e.name).replace(/"/g, '""');
    csv += `${i+1},"${safeName}",${e.score},${e.total},"${timeStr}"\n`;
  });
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "translation_critic_leaderboard.csv";
  link.click();
}

renderIntro();
</script>
</body>
</html>
